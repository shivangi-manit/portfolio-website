<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Shivangi Gupta</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23174EA6'/><text x='50%' y='65%' font-size='50' font-weight='bold' fill='white' text-anchor='middle' font-family='monospace'>SG</text></svg>" />
  <link rel="stylesheet" href="./src/css/variables.css" />

  <style>
    body {

      font-family: var(--font-main);

<body>
  <div class="error-card">

    <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem;">

    <a href="./" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem;">
